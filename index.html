<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ในหัวใจของพี่</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Prompt', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: #fff;
        }

        /* หน้าหลัก: หัวใจ 4 ห้อง */
        #main-menu {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1.main-title {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: pulseTitle 2s infinite;
        }

        .heart-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
        }

        .big-heart {
            position: absolute;
            width: 320px;
            height: 320px;
            background-color: rgba(255, 255, 255, 0.15);
            transform: rotate(45deg);
            top: 0;
            left: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 20px;
            pointer-events: none;
        }

        .room-btn {
            position: absolute;
            width: 120px;
            height: 120px;
            background: #fff;
            color: #ff477e;
            border: none;
            border-radius: 20px;
            font-family: 'Prompt', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .room-btn:hover {
            transform: scale(1.1);
            background: #ff477e;
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 71, 126, 0.4);
        }

        #room1-btn { top: 30px; left: 30px; }
        #room2-btn { top: 30px; right: 30px; }
        #room3-btn { bottom: 40px; left: 30px; }
        #room4-btn { bottom: 40px; right: 30px; }

        /* หน้าต่างห้องย่อย */
        .room-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffe6ec;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ff477e;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.2s;
            z-index: 110;
        }

        .back-btn:hover {
            background: #e03568;
        }

        /* --- ห้องที่ 1: คำว่า "ปาย" สุ่มเต็มจอ --- */
        #room1-content {
            position: relative;
            width: 100%;
            height: 100%;
            background: #2a080c;
            overflow: hidden;
        }
        .random-pai {
            position: absolute;
            font-weight: bold;
            color: #ff6584;
            text-shadow: 0 0 10px rgba(255, 101, 132, 0.6);
            animation: fadeInPai 0.5s ease-out forwards;
            user-select: none;
        }
        @keyframes fadeInPai {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1) rotate(var(--rot)); opacity: 0.9; }
        }

        /* --- ห้องที่ 2: คิดถึงอยากเจอๆ เต็มไปหมด --- */
        #room2-content {
            background: #fff0f3;
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .scrolling-text {
            font-size: 2rem;
            color: #ff477e;
            font-weight: 600;
            white-space: nowrap;
            position: absolute;
            animation: scrollText 10s linear infinite;
        }
        @keyframes scrollText {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* --- ห้องที่ 3: ปุ่มรักที่สุด & สุ่มรูปภาพ --- */
        #room3-content {
            background: #fff5f7;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .love-btn {
            background: #ff477e;
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Prompt', sans-serif;
            box-shadow: 0 5px 20px rgba(255,71,126,0.4);
            transition: 0.3s;
            z-index: 50;
        }
        .love-btn:hover {
            transform: scale(1.1);
            background: #e03568;
        }
        .random-img {
            position: absolute;
            width: 120px;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            border: 4px solid white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            animation: popIn 0.5s ease-out forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            100% { transform: scale(1) rotate(var(--rot)); opacity: 1; }
        }

        /* --- ห้องที่ 4: หัวใจเต้น & ข้อความซึ้งๆ --- */
        #room4-content {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .beating-heart {
            width: 100px;
            height: 100px;
            background: #ff2a5f;
            position: relative;
            transform: rotate(45deg);
            margin-bottom: 50px;
            box-shadow: 0 0 30px rgba(255,42,95,0.6);
        }
        .beating-heart::before, .beating-heart::after {
            content: '';
            width: 100px;
            height: 100px;
            background: #ff2a5f;
            border-radius: 50%;
            position: absolute;
        }
        .beating-heart::before { top: -50px; left: 0; }
        .beating-heart::after { top: 0; left: -50px; }

        .beat-anim {
            animation: heartbeat 0.8s ease-in-out 4;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1) rotate(45deg); }
            50% { transform: scale(1.3) rotate(45deg); }
        }

        .message-box {
            font-size: 1.8rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            min-height: 60px;
            text-align: center;
        }

        @keyframes pulseTitle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- หน้าหลัก -->
    <div id="main-menu">
        <h1 class="main-title">ในหัวใจของพี่ ❤️</h1>
        <div class="heart-container">
            <div class="big-heart"></div>
            <button class="room-btn" id="room1-btn" onclick="openRoom(1)">ห้องที่ 1</button>
            <button class="room-btn" id="room2-btn" onclick="openRoom(2)">ห้องที่ 2</button>
            <button class="room-btn" id="room3-btn" onclick="openRoom(3)">ห้องที่ 3</button>
            <button class="room-btn" id="room4-btn" onclick="openRoom(4)">ห้องที่ 4</button>
        </div>
    </div>

    <!-- ห้องที่ 1 -->
    <div id="room1" class="room-view">
        <button class="back-btn" onclick="closeRoom()">← กลับหน้าหลัก</button>
        <div id="room1-content"></div>
    </div>

    <!-- ห้องที่ 2 -->
    <div id="room2" class="room-view">
        <button class="back-btn" onclick="closeRoom()">← กลับหน้าหลัก</button>
        <div id="room2-content"></div>
    </div>

    <!-- ห้องที่ 3 -->
    <div id="room3" class="room-view">
        <button class="back-btn" onclick="closeRoom()">← กลับหน้าหลัก</button>
        <div id="room3-content">
            <button class="love-btn" onclick="triggerRoom3()">รักที่สุด ❤️</button>
        </div>
    </div>

    <!-- ห้องที่ 4 -->
    <div id="room4" class="room-view">
        <button class="back-btn" onclick="closeRoom()">← กลับหน้าหลัก</button>
        <div id="room4-content">
            <div class="beating-heart" id="heart-icon"></div>
            <div class="message-box" id="msg-box">กดปุ่มเริ่มห้องที่ 4 เพื่อดูความรู้สึก...</div>
            <button class="love-btn" style="margin-top: 30px;" onclick="startRoom4()">เริ่มเลย ❤️</button>
        </div>
    </div>

    <script>
        const images = [
            "Screenshot 2026-10-16 012821.png",
            "Screenshot 2026-10-16 012827.png",
            "Screenshot 2026-10-16 012834.png",
            "Screenshot 2026-10-16 012840.png",
            "Screenshot 2026-10-16 012854.png",
            "Screenshot 2026-10-16 012859.png",
            "Screenshot 2026-10-16 012906.png",
            "Screenshot 2026-10-16 013150.png",
            "Screenshot 2026-10-16 013155.png",
            "Screenshot 2026-10-16 013159.png"
        ];

        let room1Interval;
        let room2Interval;

        function openRoom(roomNum) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById(`room${roomNum}`).style.display = 'flex';

            if (roomNum === 1) {
                startRoom1Animation();
            } else if (roomNum === 2) {
                startRoom2Animation();
            }
        }

        function closeRoom() {
            document.querySelectorAll('.room-view').forEach(room => room.style.display = 'none');
            document.getElementById('main-menu').style.display = 'block';
            clearInterval(room1Interval);
            clearInterval(room2Interval);
            // เคลียร์เอฟเฟกต์ค้าง
            document.querySelectorAll('.random-pai, .scrolling-text, .random-img').forEach(el => el.remove());
        }

        // --- ห้องที่ 1: คำว่า "ปาย" สุ่มเต็มจอ ---
        function startRoom1Animation() {
            const container = document.getElementById('room1-content');
            container.innerHTML = '';

            room1Interval = setInterval(() => {
                const paiSpan = document.createElement('div');
                paiSpan.className = 'random-pai';
                paiSpan.innerText = 'ปาย';

                // สุ่มตำแหน่ง X, Y และขนาดตัวอักษร
                const randomX = Math.random() * (window.innerWidth - 100);
                const randomY = Math.random() * (window.innerHeight - 50);
                const randomSize = Math.floor(Math.random() * 2.5) + 1; // ขนาด 1rem ถึง 3.5rem
                const randomRot = (Math.random() * 60 - 30) + 'deg';

                paiSpan.style.left = randomX + 'px';
                paiSpan.style.top = randomY + 'px';
                paiSpan.style.fontSize = randomSize + 'rem';
                paiSpan.style.setProperty('--rot', randomRot);

                container.appendChild(paiSpan);

                // จำกัดจำนวนไม่ให้ล้นหน่วยความจำ (ลบออกเมื่อเกิน 60 ตัว)
                if (container.children.length > 60) {
                    container.removeChild(container.firstChild);
                }
            }, 150);
        }

        // --- ห้องที่ 2: คิดถึงอยากเจอๆ เต็มไปหมด ---
        function startRoom2Animation() {
            const container = document.getElementById('room2-content');
            container.innerHTML = ''; 
            
            room2Interval = setInterval(() => {
                const textDiv = document.createElement('div');
                textDiv.className = 'scrolling-text';
                textDiv.innerText = "คิดถึงอยากเจอๆ คิดถึงอยากเจอๆ คิดถึงอยากเจอๆ";
                textDiv.style.top = Math.random() * (window.innerHeight - 50) + 'px';
                textDiv.style.animationDuration = (Math.random() * 3 + 4) + 's';
                container.appendChild(textDiv);

                setTimeout(() => textDiv.remove(), 7000);
            }, 300);
        }

        // --- ห้องที่ 3: ปุ่มรักที่สุด & สุ่มรูปภาพ ---
        function triggerRoom3() {
            const container = document.getElementById('room3-content');
            images.forEach((imgSrc, index) => {
                setTimeout(() => {
                    const img = document.createElement('img');
                    img.src = imgSrc;
                    img.className = 'random-img';
                    
                    const randomX = Math.random() * (window.innerWidth - 150);
                    const randomY = Math.random() * (window.innerHeight - 180);
                    const randomRot = (Math.random() * 40 - 20) + 'deg';

                    img.style.left = randomX + 'px';
                    img.style.top = randomY + 'px';
                    img.style.setProperty('--rot', randomRot);
                    
                    container.appendChild(img);
                }, index * 150);
            });
        }

        // --- ห้องที่ 4: หัวใจเต้น & ข้อความซึ้งๆ ---
        function startRoom4() {
            const heart = document.getElementById('heart-icon');
            const msgBox = document.getElementById('msg-box');
            
            heart.classList.remove('beat-anim');
            void heart.offsetWidth; 
            heart.classList.add('beat-anim');

            const messages = [
                "หวงนะคับ ❤️",
                "รักนะคับ ❤️",
                "คิดถึงนะคับ ❤️",
                "อยากเจอนะคับ ❤️",
                "อยากกอดนะคับ ❤️",
                "เป็นห่วงนะคับ ❤️",
                "รักที่สุดนะคับ ❤️"
            ];

            let i = 0;
            msgBox.innerText = messages[0];
            
            const msgInterval = setInterval(() => {
                i++;
                if (i < messages.length) {
                    msgBox.innerText = messages[i];
                } else {
                    clearInterval(msgInterval);
                }
            }, 800);
        }
    </script>
</body>
</html>
